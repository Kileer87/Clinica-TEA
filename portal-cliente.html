<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Cliente - Clínica Comunicar</title>
    <link rel="stylesheet" href="portal-cliente.css">
</head>
<body>

    <div class="client-container">
        <header class="client-header">
            <h2>📅 Portal de Agendamento Infantil</h2>
            <p>Selecione o melhor dia e horário para a sessão do seu filho.</p>
        </header>

        <!-- FORMULÁRIO DE AGENDAMENTO -->
        <div class="client-card">
            <h3>Solicitar Novo Horário</h3>
            <form id="formAgendamentoCliente" style="margin-top: 15px;">
                <div class="form-group">
                    <label for="nomeCrianca">Nome da Criança:</label>
                    <input type="text" id="nomeCrianca" class="form-input" placeholder="Ex: Bento Afonso" required>
                </div>

                <div class="form-group">
                    <label for="dataAgendamento">Selecione o Dia:</label>
                    <input type="date" id="dataAgendamento" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="horaAgendamento">Selecione o Horário:</label>
                    <select id="horaAgendamento" class="form-input" required>
                        <option value="">-- Escolha o horário --</option>
                        <option value="08:00">08:00</option>
                        <option value="09:00">09:00</option>
                        <option value="10:30">10:30</option>
                        <option value="14:00">14:00</option>
                        <option value="15:00">15:00</option>
                        <option value="16:00">16:00</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Enviar Solicitação de Horário</button>
            </form>
        </div>

        <!-- CONTATO VIA WHATSAPP -->
        <div class="whatsapp-section">
            <p>Precisa de ajuda ou deseja alterar um horário confirmado?</p>
            <a href="https://wa.me/5581985828087?text=Olá!%20Gostaria%20de%20mais%20informações%20sobre%20os%20agendamentos%20na%20Clínica%20Comunicar." 
               target="_blank" class="btn-whatsapp">
               💬 Falar pelo WhatsApp
            </a>
        </div>
    </div>

    <script src="portal-cliente.js"></script>
</body>
</html>
